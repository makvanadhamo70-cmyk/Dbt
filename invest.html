<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investments - Realtime Firebase Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #104B91;
            --primary-gradient: linear-gradient(135deg, #104B91, #1e40af);
            --success: #2e7d32;
            --warning: #ef6c00;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--background); color: var(--text-main); padding: 12px; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

        /* --- REAL-TIME WALLET SUMMARY --- */
        .wallet-card {
            background: linear-gradient(135deg, #0b132b, #1c2541);
            padding: 20px; border-radius: 20px; color: white;
            box-shadow: 0 10px 25px rgba(11, 19, 43, 0.15);
            display: flex; justify-content: space-between; align-items: center;
        }
        .wallet-info h3 { font-size: 11px; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.5px; }
        .wallet-info .balance { font-size: 28px; font-weight: 800; margin-top: 4px; }
        .wallet-stats { text-align: right; }
        .wallet-stats p { font-size: 11px; color: #cbd5e1; }
        .wallet-stats .inv-amount { font-size: 16px; font-weight: 700; color: #38bdf8; margin-top: 2px; }

        /* --- ACTIVE PORTFOLIO TRACKER --- */
        .portfolio-highlight { background: var(--surface); border: 2px solid #e0f2fe; border-radius: 20px; padding: 16px; }
        .highlight-title { font-size: 13px; font-weight: 800; color: #0369a1; margin-bottom: 12px; text-transform: uppercase; }
        .active-plan-item { background: #f0f9ff; border-radius: 12px; padding: 12px; border-left: 4px solid var(--primary); margin-bottom: 10px; }
        .active-plan-item h4 { font-size: 13px; font-weight: 700; }
        .timer-box { font-size: 11px; font-weight: 700; color: var(--warning); background: #fff7ed; padding: 2px 6px; border-radius: 4px; display: inline-block; margin: 4px 0; }
        .claim_btn { background: var(--success); color: white; border: none; padding: 8px; font-size: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 6px; }
        .claim_btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

        .expired-container { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; }
        .expired-chip { background: #f1f5f9; border-radius: 8px; padding: 4px 10px; font-size: 11px; color: var(--text-muted); white-space: nowrap; border: 1px solid var(--border); }

        /* --- CATEGORY TABS --- */
        .category-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #edf2f7; padding: 4px; border-radius: 10px; }
        .tab-btn { background: transparent; border: none; padding: 8px 2px; font-size: 12px; font-weight: 700; color: var(--text-muted); cursor: pointer; border-radius: 6px; text-align: center; }
        .tab-btn.active { background: var(--surface); color: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

        .user-owned-header { background: linear-gradient(135deg, #f0fdf4, #dcfce7); border: 1px dashed var(--success); padding: 10px; border-radius: 12px; font-size: 12px; font-weight: 600; color: var(--success); }

        /* --- PRODUCT MARKETPLACE --- */
        .product-list { display: flex; flex-direction: column; gap: 12px; }
        .product_card { background: var(--surface); border-radius: 16px; padding: 14px; position: relative; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        .product_title { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .product_info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .product_name { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .product_item { display: flex; justify-content: space-between; font-size: 11px; }
        .product_item .label { color: var(--text-muted); }
        .product_item .value { font-weight: 600; }
        .product_image img { width: 65px; height: 65px; object-fit: cover; border-radius: 8px; }
        
        .buy_card { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 1px solid #f1f5f9; }
        .price_tag { font-weight: 800; font-size: 16px; color: var(--primary); }
        .buy_btn { background: var(--primary-gradient); color: white; border: none; padding: 8px 16px; font-size: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">

    <!-- DASHBOARD REAL-TIME WALLET -->
    <div class="wallet-card">
        <div class="wallet-info">
            <h3>Current Balance</h3>
            <!-- No default value here, completely dependent on your database -->
            <div class="balance">₹<span id="wallet-balance">0.00</span></div>
        </div>
        <div class="wallet-stats">
            <p>Active Running Assets</p>
            <div class="inv-amount">₹<span id="active-investment">0.00</span></div>
        </div>
    </div>

    <!-- LIVE PORTFOLIO DISPATCHER -->
    <div class="portfolio-highlight">
        <div class="highlight-title">💼 My Active Portfolio</div>
        <div id="activePortfolioContainer"></div>
        <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); margin: 8px 0 4px 0;">Settled History Logs:</div>
        <div class="expired-container" id="expiredChipsContainer"></div>
    </div>

    <!-- MAIN MARKET FILTER TABS -->
    <div class="category-tabs">
        <button class="tab-btn active" onclick="switchCategory('Daily', this)">Daily Plans</button>
        <button class="tab-btn" onclick="switchCategory('Weekly', this)">Weekly Plans</button>
        <button class="tab-btn" onclick="switchCategory('Long', this)">Long Term</button>
    </div>

    <!-- STATUS BANNER AREA -->
    <div id="ownedHighlightArea"></div>

    <!-- PRODUCTS DISPATCH LOOP -->
    <div class="product-list" id="marketplaceContainer">
        <p style="font-size:12px; text-align:center; color:var(--text-muted); padding:20px;">Connecting to real-time database...</p>
    </div>

</div>

<!-- FIREBASE SDK INJECTION (ES MODULES) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ⚠️ REPLACE THIS CONFIG WITH YOUR ACTUAL FIREBASE PROJECT CONFIG
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Dynamic Variables
    let globalWalletBalance = 0.00;
    let productsArray = [];
    let userInvestmentsArray = [];
    let currentCategory = "Daily";
    
    // User Session ID (Aap yahan user ki unique ID login system/localStorage se catch kar sakte hain)
    const userId = localStorage.getItem('current_user_id') || "USER_01"; 

    // DOM Target Hooks
    const walletBal = document.getElementById('wallet-balance');
    const activeInv = document.getElementById('active-investment');
    const marketplaceContainer = document.getElementById('marketplaceContainer');
    const activePortfolioContainer = document.getElementById('activePortfolioContainer');
    const expiredChipsContainer = document.getElementById('expiredChipsContainer');
    const ownedHighlightArea = document.getElementById('ownedHighlightArea');

    // --- 1. REAL-TIME BALANCES & INVESTMENTS SYNC ---
    const userRef = ref(db, 'users/' + userId);
    onValue(userRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            globalWalletBalance = parseFloat(data.balance) || 0.00;
            userInvestmentsArray = data.investments ? Object.values(data.investments) : [];
            
            // Instantly update layout
            walletBal.innerText = globalWalletBalance.toFixed(2);
            calculateActiveInvestmentSum();
            renderUserPortfolio();
        } else {
            // Safe fallback if user node doesn't exist
            walletBal.innerText = "0.00";
        }
    });

    // --- 2. REAL-TIME MARKETPLACE PRODUCTS SYNC ---
    // Dashboard se product add, edit ya delete hote hi yeh automatically update hoga
    const productsRef = ref(db, 'products');
    onValue(productsRef, (snapshot) => {
        const data = snapshot.val();
        productsArray = [];
        if (data) {
            // Firebase object to array parsing
            Object.keys(data).forEach(key => {
                productsArray.push({ id: key, ...data[key] });
            });
        }
        renderMarketplace();
    });

    function calculateActiveInvestmentSum() {
        let activeSum = userInvestmentsArray
            .filter(i => i.status === "RUNNING")
            .reduce((acc, curr) => acc + parseFloat(curr.price), 0);
        activeInv.innerText = activeSum.toFixed(2);
        renderOwnedHeaderHighlight();
    }

    function renderOwnedHeaderHighlight() {
        ownedHighlightArea.innerHTML = '';
        let currentRunningPlans = userInvestmentsArray.filter(i => i.status === "RUNNING");
        if (currentRunningPlans.length > 0) {
            let lastPlan = currentRunningPlans[currentRunningPlans.length - 1];
            ownedHighlightArea.innerHTML = `
                <div class="user-owned-header">
                    👑 <b>My Active Product:</b> ${lastPlan.heading} is actively generating revenue cycles.
                </div>
            `;
        }
    }

    // Category Swapping
    window.switchCategory = function(cat, element) {
        currentCategory = cat;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        renderMarketplace();
    }

    // Render Marketplace UI
    function renderMarketplace() {
        marketplaceContainer.innerHTML = '';
        let filtered = productsArray.filter(p => p.category === currentCategory);

        if(filtered.length === 0) {
            marketplaceContainer.innerHTML = `<p style="font-size:12px; text-align:center; color:var(--text-muted); padding:20px;">No plans listed in this category on the dashboard.</p>`;
            return;
        }

        filtered.forEach(product => {
            let totalCalc = parseFloat(product.dailyIncome) * parseFloat(product.revenue);
            const card = `
                <div class="product_card">
                    <div class="product_title">
                        <div class="product_info">
                            <div class="product_name">${product.heading}</div>
                            <div class="product_item"><span class="label">Profit Cycle:</span><span class="value" style="color:var(--success)">₹${product.dailyIncome} / ${product.timeUnit.slice(0,-1)}</span></div>
                            <div class="product_item"><span class="label">Lifetime Term:</span><span class="value">${product.revenue} ${product.timeUnit}</span></div>
                            <div class="product_item"><span class="label">Total Return:</span><span class="value" style="color:var(--primary)">₹${totalCalc}</span></div>
                        </div>
                        <div class="product_image"><img src="${product.imageUrl || 'https://images.unsplash.com/photo-1620714223084-8fcacc6dfd8d?w=150'}"></div>
                    </div>
                    <div class="buy_card">
                        <div class="price_tag">₹${product.price}</div>
                        <button class="buy_btn" onclick="buyAsset('${product.id}')">Instant Buy</button>
                    </div>
                </div>
            `;
            marketplaceContainer.insertAdjacentHTML('beforeend', card);
        });
    }

    // Buy Action Connected with Firebase
    window.buyAsset = function(productId) {
        let product = productsArray.find(p => p.id === productId);
        if(!product) return;
        
        let cost = parseFloat(product.price);
        if (globalWalletBalance < cost) {
            alert("Transaction Blocked: Insufficient Balance.");
            return;
        }

        let updatedBalance = globalWalletBalance - cost;
        let timeMultiplier = product.timeUnit === "Hours" ? 60 * 60 * 1000 : 24 * 60 * 60 * 1000;
        let totalDurationMs = parseInt(product.revenue) * timeMultiplier;
        let currentTime = Date.now();

        let txnId = 'TXN-' + Math.floor(1000 + Math.random() * 9000);
        let newOrder = {
            id: txnId,
            heading: product.heading,
            price: product.price,
            dailyIncome: parseFloat(product.dailyIncome),
            totalEarning: parseFloat(product.dailyIncome) * parseFloat(product.revenue),
            timeUnit: product.timeUnit,
            endTime: currentTime + totalDurationMs,
            lastClaim: currentTime,
            claimedAmt: 0,
            status: "RUNNING"
        };

        // Sync structure changes direct to Firebase references
        const updates = {};
        updates['users/' + userId + '/balance'] = updatedBalance;
        updates['users/' + userId + '/investments/' + txnId] = newOrder;
        
        update(ref(db), updates).then(() => {
            alert("Investment Successful!");
        }).catch(err => alert("Transaction failed: " + err.message));
    };

    // Render Portfolio Realtime
    function renderUserPortfolio() {
        activePortfolioContainer.innerHTML = '';
        expiredChipsContainer.innerHTML = '';

        let activeCount = 0;
        let now = Date.now();

        userInvestmentsArray.forEach(inv => {
            if (inv.status === "RUNNING") {
                let msLeft = inv.endTime - now;

                if (msLeft <= 0) {
                    // Automatically settle contract inside DB
                    let finalLeftover = inv.totalEarning - inv.claimedAmt;
                    let finalBalance = globalWalletBalance + (finalLeftover > 0 ? finalLeftover : 0);
                    
                    const settleUpdates = {};
                    settleUpdates['users/' + userId + '/balance'] = finalBalance;
                    settleUpdates['users/' + userId + '/investments/' + inv.id + '/status'] = "SETTLED";
                    settleUpdates['users/' + userId + '/investments/' + inv.id + '/claimedAmt'] = inv.totalEarning;
                    update(ref(db), settleUpdates);
                    return;
                }

                activeCount++;
                let hrsRemaining = msLeft / (1000 * 60 * 60);
                let timeLabel = inv.timeUnit === "Hours" 
                    ? `${Math.ceil(hrsRemaining)} hours remaining` 
                    : `${(hrsRemaining / 24).toFixed(1)} days remaining`;

                let baseCycle = inv.timeUnit === "Hours" ? 60 * 60 * 1000 : 24 * 60 * 60 * 1000;
                let msSinceClaim = now - inv.lastClaim;
                let collectableUnits = Math.floor(msSinceClaim / baseCycle);
                let claimableCash = collectableUnits * inv.dailyIncome;
                let totalRemainingEarnings = inv.totalEarning - inv.claimedAmt;

                const activeNode = `
                    <div class="active-plan-item">
                        <h4>${inv.heading}</h4>
                        <div class="timer-box">⏳ ${timeLabel}</div>
                        <div style="display:flex; flex-direction:column; gap:2px; font-size:11px; margin:4px 0;">
                            <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-muted)">Remaining Future Profit:</span><b>₹${totalRemainingEarnings.toFixed(2)}</b></div>
                            <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-muted)">Available Claim Pool:</span><span style="color:var(--success); font-weight:700;">₹${claimableCash.toFixed(2)}</span></div>
                        </div>
                        <button class="claim_btn" ${claimableCash <= 0 ? 'disabled' : ''} 
                            onclick="executePortfolioClaim('${inv.id}', ${claimableCash}, ${collectableUnits}, ${baseCycle})">
                            Claim Earnings
                        </button>
                    </div>
                `;
                activePortfolioContainer.insertAdjacentHTML('beforeend', activeNode);
            } else {
                const chip = `<div class="expired-chip">🛑 ${inv.heading} (Settled)</div>`;
                expiredChipsContainer.insertAdjacentHTML('beforeend', chip);
            }
        });

        if (activeCount === 0) {
            activePortfolioContainer.innerHTML = `<p style="font-size:11px; text-align:center; color:var(--text-muted); padding:8px;">No active data arrays stream found.</p>`;
        }
        if (expiredChipsContainer.children.length === 0) {
            expiredChipsContainer.innerHTML = `<div class="expired-chip">No historic entries.</div>`;
        }
    }

    // Claim Management Database Writer
    window.executePortfolioClaim = function(id, cash, units, cycleDuration) {
        let order = userInvestmentsArray.find(i => i.id === id);
        if (!order) return;

        let finalWallet = globalWalletBalance + cash;
        let finalClaimed = order.claimedAmt + cash;
        let finalLastClaim = order.lastClaim + (units * cycleDuration);

        const claimUpdates = {};
        claimUpdates['users/' + userId + '/balance'] = finalWallet;
        claimUpdates['users/' + userId + '/investments/' + id + '/claimedAmt'] = finalClaimed;
        claimUpdates['users/' + userId + '/investments/' + id + '/lastClaim'] = finalLastClaim;

        update(ref(db), claimUpdates);
    };

    // Global refresh engine loop every 1 second for dynamic timers
    setInterval(() => {
        renderUserPortfolio();
    }, 1000);
</script>

</body>
</html>
