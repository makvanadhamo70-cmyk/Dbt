<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Balance Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --background: #f8fafc;
            --text-main: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--background); color: var(--text-main); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; }

        /* --- LIVE WALLET PANEL --- */
        .wallet-card {
            background: linear-gradient(135deg, #0b132b, #1c2541);
            padding: 24px; border-radius: 24px; color: white;
            box-shadow: 0 12px 30px rgba(11, 19, 43, 0.2);
            text-align: center;
        }
        .wallet-card h3 { font-size: 13px; text-transform: uppercase; color: #94a3b8; letter-spacing: 1px; margin-bottom: 8px; }
        
        .balance-display { font-size: 38px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; }
        .currency-symbol { color: #38bdf8; margin-right: 2px; }
        
        .status-badge { display: inline-block; background: rgba(34, 197, 94, 0.1); color: #22c55e; font-size: 11px; padding: 4px 12px; border-radius: 50px; margin-top: 12px; font-weight: 700; }
        .user-path-tag { font-size: 11px; color: #64748b; margin-top: 8px; font-weight: 600; display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="wallet-card">
        <h3>Current Real-Time Balance</h3>
        <!-- Firebase balance data mounts instantly here -->
        <div class="balance-display"><span class="currency-symbol">₹</span><span id="wallet-balance">Loading...</span></div>
        <div class="status-badge">● Engine Online</div>
        <span class="user-path-tag" id="active-path-view">Targeting Node...</span>
    </div>
</div>

<!-- FIREBASE CONNECTION INTERFACE -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Core Project Database Credentials
    const firebaseConfig = {
        apiKey: "AIzaSyC7apT-d-R9bpcb4LcpFk4P0cpw9sKxi-0",
        authDomain: "dbt-online-earning.firebaseapp.com",
        databaseURL: "https://dbt-online-earning-default-rtdb.firebaseio.com",
        projectId: "dbt-online-earning",
        storageBucket: "dbt-online-earning.firebasestorage.app",
        messagingSenderId: "319083357519",
        appId: "1:319083357519:web:62ccf6d8ce0dca3152513a",
        measurementId: "G-7SLFPL3X1V"
    };

    // Firebase App & Database Instance boot up
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Dynamic User Route Selector
    // Dashboard storage se session user uthayega, nahi to fallback "USER_01" use karega
    const activeSessionUser = localStorage.getItem('current_user_id') || "USER_01"; 

    // Visual elements hooks
    const balanceElement = document.getElementById('wallet-balance');
    const pathViewElement = document.getElementById('active-path-view');

    // Display targeted route on screen for easy testing
    pathViewElement.innerText = `Path: users / ${activeSessionUser} / balance`;

    // --- PURE REAL-TIME DATA PIPELINE ---
    // Seedhe designated user path se target key field ko access karega
    const userBalanceDataRef = ref(db, `users/${activeSessionUser}/balance`);
    
    onValue(userBalanceDataRef, (snapshot) => {
        const liveSnapshotValue = snapshot.val();
        
        if (liveSnapshotValue !== null && liveSnapshotValue !== undefined) {
            // Numeric validation & standard float formatting 
            let processedNumericValue = parseFloat(liveSnapshotValue);
            balanceElement.innerText = processedNumericValue.toFixed(2);
        } else {
            // Null state recovery handler
            balanceElement.innerText = "0.00";
        }
    }, (error) => {
        console.error("Firebase Security Policy / Network Error: ", error);
        balanceElement.innerText = "Sync Failed";
    });
</script>

</body>
</html>
