<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>My Profile - Reliance Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f6f9fc;
            color: #0f172a;
        }
        .gradient-brand-bg {
            background: linear-gradient(270deg, #114180 0%, #833148 53%, #D32620 100%);
        }
        .vip-gold-progress {
            background: #FFCF8B;
        }
    </style>
</head>
<body class="bg-[#f6f9fc] min-h-screen pb-24">

    <div class="gradient-brand-bg text-white pt-12 pb-24 px-6 rounded-b-[45px] shadow-lg relative text-center">
        <div class="max-w-md mx-auto">
            <div class="relative w-24 h-24 mx-auto mb-3 border-4 border-white/20 rounded-full overflow-hidden shadow-2xl bg-slate-800">
                <img id="user-avatar-display" src="https://i.imgur.com/6VBx3io.png" class="w-full h-full object-cover">
            </div>
            
            <h2 id="user-profile-name" class="text-xl font-extrabold tracking-tight">Dhamo Koli</h2>
            
            <div class="mt-2.5 inline-flex items-center gap-1.5 bg-black/20 backdrop-blur-md px-3.5 py-1 rounded-full text-xs font-semibold border border-white/10 shadow-inner">
                <span class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-black text-[9px] px-2 py-0.5 rounded-md">ID</span>
                <span id="user-masked-phone" class="font-mono text-slate-100">98******50</span>
                <button onclick="copyUserIdentityClipboard()" class="text-slate-300 hover:text-white transition-colors ml-1">
                    <i class="far fa-copy text-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 -mt-14">
        <div class="bg-white rounded-3xl p-6 shadow-xl border border-slate-100/80 space-y-5">
            <div class="grid grid-cols-2 gap-4 divide-x divide-slate-100 text-center">
                <div>
                    <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Recharge Balance</p>
                    <p class="text-2xl font-black text-slate-800 mt-1">₹<span id="display-recharge-bal">0.00</span></p>
                </div>
                <div>
                    <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Withdraw Balance</p>
                    <p class="text-2xl font-black text-slate-800 mt-1">₹<span id="display-withdraw-bal">0.00</span></p>
                </div>
            </div>
            
            <div class="border-t border-slate-100 pt-4 text-center">
                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Product Income</p>
                <p class="text-lg font-extrabold text-emerald-600 mt-0.5">₹<span id="display-product-inc">0.00</span></p>
            </div>

            <div class="grid grid-cols-4 gap-2 pt-2 text-center text-xs font-bold text-slate-600">
                <a href="recharge.html" class="flex flex-col items-center gap-2 p-2 hover:bg-slate-50 rounded-2xl transition-all">
                    <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 border border-blue-100 flex items-center justify-center text-lg shadow-sm">
                        <i class="fas fa-wallet"></i>
                    </div>
                    <p class="tracking-tight text-[11px]">Recharge</p>
                </a>
                <a href="withdraw.html" class="flex flex-col items-center gap-2 p-2 hover:bg-slate-50 rounded-2xl transition-all">
                    <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 border border-emerald-100 flex items-center justify-center text-lg shadow-sm">
                        <i class="fas fa-hand-holding-usd"></i>
                    </div>
                    <p class="tracking-tight text-[11px]">Withdraw</p>
                </a>
                <a href="orders.html" class="flex flex-col items-center gap-2 p-2 hover:bg-slate-50 rounded-2xl transition-all">
                    <div class="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 border border-purple-100 flex items-center justify-center text-lg shadow-sm">
                        <i class="fas fa-file-invoice-dollar"></i>
                    </div>
                    <p class="tracking-tight text-[11px]">Orders</p>
                </a>
                <a href="bankCardInfo.html" class="flex flex-col items-center gap-2 p-2 hover:bg-slate-50 rounded-2xl transition-all">
                    <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 border border-amber-100 flex items-center justify-center text-lg shadow-sm">
                        <i class="fas fa-credit-card"></i>
                    </div>
                    <p class="tracking-tight text-[11px]">Card Wallet</p>
                </a>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 mt-4">
        <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-3xl p-5 shadow-xl flex items-center justify-between border border-slate-800">
            <div class="space-y-1.5 flex-1 pr-4">
                <div class="flex items-center gap-2">
                    <i class="fas fa-crown text-amber-400 text-sm"></i>
                    <span class="text-xs font-black uppercase tracking-widest text-amber-400">VIP Level</span>
                    <span class="bg-white/10 px-2 py-0.5 rounded font-mono text-[10px] font-bold">VIP 0</span>
                </div>
                <p class="text-[11px] text-slate-400 font-medium">Upgrade to <strong class="text-white">VIP1</strong>, still need <strong class="text-white">290</strong></p>
                
                <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden mt-2">
                    <div class="vip-gold-progress h-full rounded-full" style="width: 35%"></div>
                </div>
                <a href="vip.html" class="text-[11px] text-amber-400/90 font-bold hover:underline inline-block pt-1">Methods to Upgrade VIP &gt;</a>
            </div>
            <div class="text-center">
                <i class="fas fa-shield-alt text-5xl text-slate-700/40 block"></i>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 mt-6">
        <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100 space-y-1.5">
            <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-2 mb-2">Core Hub Services</h4>
            
            <a href="team.html" class="w-full flex items-center justify-between p-3.5 hover:bg-slate-50/80 rounded-2xl transition-all border border-transparent hover:border-slate-100 text-xs font-bold text-slate-700">
                <span class="flex items-center gap-3 text-slate-600">
                    <div class="w-8 h-8 rounded-xl bg-blue-50 text-blue-500 flex items-center justify-center text-sm"><i class="fas fa-users"></i></div>
                    My Team Network
                </span>
                <i class="fas fa-chevron-right text-slate-400 text-[10px]"></i>
            </a>

            <a href="help.html" class="w-full flex items-center justify-between p-3.5 hover:bg-slate-50/80 rounded-2xl transition-all border border-transparent hover:border-slate-100 text-xs font-bold text-slate-700">
                <span class="flex items-center gap-3 text-slate-600">
                    <div class="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-500 flex items-center justify-center text-sm"><i class="fas fa-question-circle"></i></div>
                    Help & Support System
                </span>
                <i class="fas fa-chevron-right text-slate-400 text-[10px]"></i>
            </a>

            <button onclick="triggerSettingsDrawerPanel()" class="w-full flex items-center justify-between p-3.5 hover:bg-slate-50/80 rounded-2xl transition-all border border-transparent hover:border-slate-100 text-xs font-bold text-slate-700 text-left">
                <span class="flex items-center gap-3 text-slate-600">
                    <div class="w-8 h-8 rounded-xl bg-slate-100 text-slate-500 flex items-center justify-center text-sm"><i class="fas fa-cog"></i></div>
                    Security Settings
                </span>
                <i class="fas fa-chevron-right text-slate-400 text-[10px]"></i>
            </button>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200/80 px-4 py-2.5 z-40 shadow-2xl">
        <div class="max-w-md mx-auto flex items-center justify-between text-[11px] font-bold text-slate-400">
            <a href="dashboard.html" class="flex flex-col items-center gap-1 py-1 px-3 hover:text-slate-700 transition-all">
                <i class="fas fa-home text-base"></i><span>Home</span>
            </a>
            <a href="product.html" class="flex flex-col items-center gap-1 py-1 px-3 hover:text-slate-700 transition-all">
                <i class="fas fa-chart-line text-base"></i><span>Invest</span>
            </a>
            <a href="notice.html" class="flex flex-col items-center gap-1 py-1 px-3 hover:text-slate-700 transition-all">
                <i class="fas fa-bell text-base"></i><span>Notice</span>
            </a>
            <a href="team.html" class="flex flex-col items-center gap-1 py-1 px-3 hover:text-slate-700 transition-all">
                <i class="fas fa-users text-base"></i><span>Team</span>
            </a>
            <a href="my.html" class="flex flex-col items-center gap-1 py-1 px-4 text-blue-600 bg-blue-50 rounded-xl transition-all">
                <i class="fas fa-user text-base"></i><span>My</span>
            </a>
        </div>
    </div>

    <script>
        // System Firebase Endpoint Connectivity Module Nodes
        const firebaseConfig = {
            apiKey: "AIzaSyC7apT-d-R9bpcb4LcpFk4P0cpw9sKxi-0",
            authDomain: "dbt-online-earning.firebaseapp.com",
            databaseURL: "https://dbt-online-earning-default-rtdb.firebaseio.com",
            projectId: "dbt-online-earning",
            storageBucket: "dbt-online-earning.firebasestorage.app",
            messagingSenderId: "319083357519",
            appId: "1:319083357519:web:62ccf6d8ce0dca3152513a"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Local Storage Session Credentials Target Reference Lookup
        const activeUserPhone = localStorage.getItem('userPhone') || '9876543210';
        const activeUserName = localStorage.getItem('userName') || 'Dhamo Koli';

        // Bind data parameters natively inside template fields
        document.getElementById('user-profile-name').innerText = activeUserName;
        
        // Safety telephone number string mask implementation
        if(activeUserPhone && activeUserPhone.length >= 10) {
            const maskedPhoneStr = activeUserPhone.substring(0, 2) + "******" + activeUserPhone.substring(8);
            document.getElementById('user-masked-phone').innerText = maskedPhoneStr;
        }

        // Live Balance Node Fetch Listeners Hook Realtime Synchronization
        if(activeUserPhone) {
            db.ref('users/' + activeUserPhone).on('value', function(snapshot) {
                const userDataObj = snapshot.val();
                if(userDataObj) {
                    const parsedLiveBal = parseFloat(userDataObj.balance || 0).toFixed(2);
                    document.getElementById('display-recharge-bal').innerText = parsedLiveBal;
                    document.getElementById('display-withdraw-bal').innerText = parsedLiveBal;
                    
                    if(userDataObj.avatar) {
                        document.getElementById('user-avatar-display').src = userDataObj.avatar;
                    }
                }
            });
        }

        // Text identity layout copy action helper function
        function copyUserIdentityClipboard() {
            navigator.clipboard.writeText(activeUserPhone).then(function() {
                Swal.fire({ text: 'User identity phone token copied!', icon: 'success', toast: true, position: 'top', showConfirmButton: false, timer: 1500 });
            });
        }

        // Slidable Dark Popup Account Settings Window System Controller
        function triggerSettingsDrawerPanel() {
            Swal.fire({
                title: '<span class="text-white text-base font-extrabold uppercase tracking-wide">Account Panel Settings</span>',
                background: '#0b0f19',
                customClass: { popup: 'rounded-3xl border border-slate-800 shadow-2xl' },
                showConfirmButton: false,
                showCloseButton: true,
                html: `
                    <div class="space-y-3 pt-2 text-left">
                        <a href="info.html" class="flex items-center justify-between p-3.5 bg-[#070a13] border border-slate-800 rounded-2xl text-xs font-bold text-slate-300 hover:border-slate-700 transition-colors">
                            <span class="flex items-center gap-2.5"><i class="fas fa-user-circle text-blue-400 text-sm"></i> User Information</span>
                            <i class="fas fa-chevron-right text-slate-600 text-[10px]"></i>
                        </a>
                        <a href="password.html" class="flex items-center justify-between p-3.5 bg-[#070a13] border border-slate-800 rounded-2xl text-xs font-bold text-slate-300 hover:border-slate-700 transition-colors">
                            <span class="flex items-center gap-2.5"><i class="fas fa-key text-amber-400 text-sm"></i> Login Password</span>
                            <i class="fas fa-chevron-right text-slate-600 text-[10px]"></i>
                        </a>
                        <a href="tradePassword.html" class="flex items-center justify-between p-3.5 bg-[#070a13] border border-slate-800 rounded-2xl text-xs font-bold text-slate-300 hover:border-slate-700 transition-colors">
                            <span class="flex items-center gap-2.5"><i class="fas fa-shield-alt text-emerald-400 text-sm"></i> Transaction Password</span>
                            <i class="fas fa-chevron-right text-slate-600 text-[10px]"></i>
                        </a>
                        
                        <button onclick="executeSystemSessionLogout()" class="w-full mt-4 bg-gradient-to-r from-red-600 to-rose-600 text-white font-black text-xs py-3.5 rounded-2xl uppercase tracking-wider shadow-lg shadow-red-600/10 active:scale-[0.99] transition-transform">
                            <i class="fas fa-sign-out-alt mr-1.5"></i> Secure Logout
                        </button>
                    </div>
                `
            });
        }

        // Functional logout execution engine
        window.executeSystemSessionLogout = function() {
            Swal.fire({
                title: 'Exit Hub?',
                text: "Are you sure you want to log out of your current investment profile session?",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#475569',
                confirmButtonText: 'Yes, Logout',
                background: '#0b0f19',
                customClass: { popup: 'rounded-3xl border border-slate-800 text-white', title: 'text-white' }
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.clear();
                    window.location.href = "index.html";
                }
            });
        }
    </script>
</body>
</html>
