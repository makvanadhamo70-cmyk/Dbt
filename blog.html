<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Community Feed - Official Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        @keyframes cardPop { from { opacity: 0; transform: translateY(16px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .feed-card { animation: cardPop 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen pb-10">

    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-5 py-4 flex items-center justify-between sticky top-0 z-50 shadow-sm">
        <a href="javascript:history.back(-1)" class="text-slate-600 hover:text-slate-900 transition-colors flex items-center justify-center w-9 h-9 rounded-xl bg-slate-50 border border-slate-200">
            <i class="fas fa-chevron-left text-sm"></i>
        </a>
        <h1 class="text-base font-extrabold tracking-wide text-slate-800 uppercase">Withdrawal Blog</h1>
        <div class="w-9 h-9 flex items-center justify-center rounded-xl bg-amber-50 border border-amber-200" onclick="triggerRulesPopup()">
            <i class="fas fa-gift text-amber-600 text-sm animate-bounce"></i>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-4" id="global-blog-feed">
        <div id="loading-placeholder" class="text-center py-12 text-slate-400 font-medium text-xs space-y-2">
            <i class="fas fa-circle-notch text-amber-500 text-2xl animate-spin"></i>
            <p class="tracking-wider">Streaming premium feedback records...</p>
        </div>
    </main>

    <div class="fixed right-4 bottom-6 flex flex-col gap-3 z-40">
        <button onclick="triggerRulesPopup()" class="w-12 h-12 bg-white border border-slate-200 rounded-full flex flex-col items-center justify-center shadow-xl hover:scale-105 active:scale-95 transition-all text-slate-600">
            <i class="fas fa-scroll text-sm text-amber-500"></i>
            <span class="text-[9px] font-bold mt-0.5">Rules</span>
        </button>
        <button onclick="window.location.href='https://t.me/Reliance11223'" class="w-12 h-12 bg-gradient-to-tr from-amber-500 to-yellow-400 text-white rounded-full flex flex-col items-center justify-center shadow-xl shadow-amber-500/20 hover:scale-105 active:scale-95 transition-all">
            <i class="fas fa-paper-plane text-sm"></i>
            <span class="text-[9px] font-black uppercase mt-0.5 tracking-tight">Post</span>
        </button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC7apT-d-R9bpcb4LcpFk4P0cpw9sKxi-0",
            authDomain: "dbt-online-earning.firebaseapp.com",
            databaseURL: "https://dbt-online-earning-default-rtdb.firebaseio.com",
            projectId: "dbt-online-earning",
            storageBucket: "dbt-online-earning.firebasestorage.app",
            messagingSenderId: "319083357519",
            appId: "1:319083357519:web:62ccf6d8ce0dca3152513a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function triggerRulesPopup() {
            Swal.fire({
                title: '<span class="text-slate-800 font-extrabold text-lg uppercase tracking-wide">Share & Earn Reward</span>',
                html: `<div class="text-center p-2 space-y-4"><div class="w-20 h-20 bg-amber-50 border border-amber-200 text-amber-500 rounded-2xl flex items-center justify-center text-4xl mx-auto shadow-inner"><i class="fas fa-wallet"></i></div><p class="text-xs text-slate-500 font-medium leading-relaxed">Send a screenshot of your latest successful withdrawal transaction inside the official support group. Once received, you will instantly receive a gift of <span class="text-emerald-600 font-bold">₹15.00 to ₹555.00</span> straight into your wallet!</p></div>`,
                showCancelButton: true,
                confirmButtonText: '<i class="fab fa-telegram-plane mr-1.5"></i> Open Channel',
                cancelButtonText: 'I Understand',
                confirmButtonColor: '#d97706',
                cancelButtonColor: '#64748b',
                customClass: { popup: 'rounded-3xl border border-slate-100 shadow-2xl', confirmButton: 'rounded-xl font-bold text-xs uppercase tracking-wide px-4 py-2.5', cancelButton: 'rounded-xl font-bold text-xs uppercase tracking-wide px-4 py-2.5' }
            }).then((result) => { if (result.isConfirmed) { window.location.href = "https://t.me/Reliance11223"; } });
        }

        db.ref('site_blogs').on('value', function(snap) {
            const container = document.getElementById('global-blog-feed');
            const data = snap.val();
            if(!data) {
                container.innerHTML = `<div class="text-center py-20 text-slate-400"><i class="fas fa-folder-open text-4xl text-slate-300 mb-3 block"></i><p class="text-xs font-semibold">No community stories published today yet.</p></div>`;
                return;
            }
            container.innerHTML = "";
            Object.keys(data).reverse().forEach(function(postKey, index) {
                const post = data[postKey];
                const cardDelay = index * 0.05;
                const cardHtml = `
                    <div class="feed-card bg-white border border-slate-200/60 p-5 rounded-3xl shadow-sm space-y-3.5 relative" style="animation-delay: ${cardDelay}s">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <img src="${post.avatar || 'https://i.imgur.com/6VBx3io.png'}" class="w-10 h-10 rounded-full border border-slate-200 object-cover">
                                <div>
                                    <h4 class="text-sm font-black text-slate-800 tracking-tight">${post.nickname || 'Investor'}</h4>
                                    <p class="text-[11px] font-mono text-slate-400 mt-0.5"><i class="fas fa-phone-alt text-[9px] mr-0.5"></i> +91 ******${post.lastFour || 'XXXX'}</p>
                                </div>
                            </div>
                            <div class="bg-emerald-50 text-emerald-600 border border-emerald-100 rounded-xl px-2.5 py-1 flex items-center gap-1 text-[11px] font-extrabold shadow-sm">
                                <i class="fas fa-check-circle text-[10px]"></i> Guaranteed
                            </div>
                        </div>
                        <div class="text-slate-600 text-xs font-medium leading-relaxed bg-slate-50/60 border border-slate-100 p-3 rounded-2xl">${post.contents}</div>
                        ${post.image ? `<div class="rounded-2xl overflow-hidden border border-slate-100 max-h-52 bg-slate-50 cursor-zoom-in" onclick="previewImageSource('${post.image}')"><img src="${post.image}" class="w-full h-full object-cover hover:scale-[1.02] transition-transform duration-300"></div>` : ''}
                        <div class="flex items-center justify-between border-t border-slate-100 pt-3 text-[11px] text-slate-400 font-semibold">
                            <span class="flex items-center gap-1"><i class="far fa-clock"></i> ${post.create_time || 'Just now'}</span>
                            <span class="text-amber-500 flex items-center gap-0.5 bg-amber-50 px-2 py-0.5 rounded-md text-[10px] font-bold border border-amber-100"><i class="fas fa-gift text-[9px]"></i> Bonus Distributed</span>
                        </div>
                    </div>`;
                container.innerHTML += cardHtml;
            });
        });

        function previewImageSource(srcUrl) {
            Swal.fire({ imageUrl: srcUrl, showConfirmButton: false, background: 'transparent', customClass: { popup: 'shadow-none border-0 bg-transparent' }, showCloseButton: true, closeButtonHtml: '<i class="fas fa-times text-white bg-slate-900/40 p-2 rounded-full"></i>' });
        }
    </script>
</body>
</html>
