<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit - Reliance Hub</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        body{
            background:#f4f7f9;
            font-family:'Roboto',sans-serif;
            margin:0;
            padding-bottom:20px;
        }

        .header-blue{
            background:linear-gradient(to bottom,#1a4a8e,#2563eb);
            height:180px;
            border-bottom-left-radius:50px;
            border-bottom-right-radius:50px;
            padding:20px;
            position:relative;
        }

        .deposit-card{
            background:white;
            border-radius:20px;
            margin:-80px 15px 20px;
            padding:20px;
            box-shadow:0 10px 25px rgba(0,0,0,0.1);
        }

        .amt-circle{
            width:70px;
            height:70px;
            border:1.5px solid #e2e8f0;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
            background:white;
            color:#64748b;
        }

        .amt-circle.active{
            border-color:#1e40af;
            color:#1e40af;
            background:#eff6ff;
            box-shadow:0 0 10px rgba(30,64,175,0.2);
        }

        .bonus-badge{
            background:#fef2f2;
            color:#ef4444;
            font-size:10px;
            font-weight:bold;
            padding:2px 8px;
            border-radius:10px;
            margin-top:4px;
        }

        .history-card{
            background:white;
            border-radius:15px;
            margin:20px 15px;
            padding:15px;
        }

        .btn-phonepe{
            background:#5f259f;
            color:white;
        }

        .btn-gpay{
            background:#fff;
            color:#5f6368;
            border:1px solid #dadce0;
        }

        .btn-paytm{
            background:#00baf2;
            color:white;
        }

        .hidden-section{
            display:none;
        }
    </style>
</head>
<body>

<div class="header-blue">
    <div class="flex items-center justify-between">
        <i class="fas fa-chevron-left text-white text-xl"
        onclick="history.back()"></i>

        <h1 class="text-white text-xl font-bold">
            Deposit
        </h1>
    </div>
</div>

<div class="deposit-card">

    <label class="text-gray-500 font-bold text-sm">
        Deposit Amount
    </label>

    <div class="relative mt-2">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
            ₹
        </span>

        <input
        type="number"
        id="final-amt"
        placeholder="Enter Amount (Min ₹100)"
        oninput="validateAmount()"
        class="w-full bg-gray-50 border border-gray-200 rounded-lg py-4 pl-10 pr-4 text-xl font-bold text-blue-900 outline-none"
        readonly>
    </div>

    <!-- AMOUNT GRID -->

    <div class="grid grid-cols-3 gap-y-6 mt-6 justify-items-center">

        <div class="flex flex-col items-center"
        onclick="selectAmt(100,this)">
            <div class="amt-circle">100</div>
            <span class="bonus-badge">+₹10</span>
        </div>

        <div class="flex flex-col items-center"
        onclick="selectAmt(300,this)">
            <div class="amt-circle">300</div>
            <span class="bonus-badge">+₹50</span>
        </div>

        <div class="flex flex-col items-center"
        onclick="selectAmt(500,this)">
            <div class="amt-circle">500</div>
            <span class="bonus-badge">+₹100</span>
        </div>

        <div class="flex flex-col items-center"
        onclick="selectAmt(1000,this)">
            <div class="amt-circle">1000</div>
            <span class="bonus-badge">+₹200</span>
        </div>

        <div class="flex flex-col items-center"
        onclick="selectAmt(5000,this)">
            <div class="amt-circle">5000</div>
            <span class="bonus-badge">+₹1000</span>
        </div>

        <div class="flex flex-col items-center"
        onclick="selectAmt(10000,this)">
            <div class="amt-circle">10000</div>
            <span class="bonus-badge">+₹2000</span>
        </div>

    </div>

    <!-- PAYMENT APPS -->

    <div id="apps-section" class="mt-8 hidden-section">

        <label class="text-gray-400 font-bold text-xs uppercase tracking-wider block mb-3 text-center">
            Select App To Pay
        </label>

        <div class="space-y-3">

            <button
            onclick="triggerPayment('phonepe')"
            class="btn-phonepe w-full font-bold py-3.5 px-4 rounded-xl shadow flex items-center justify-center gap-3">

                <i class="fas fa-wallet"></i>
                Pay via PhonePe

            </button>

            <button
            onclick="triggerPayment('gpay')"
            class="btn-gpay w-full font-bold py-3.5 px-4 rounded-xl shadow flex items-center justify-center gap-3">

                <i class="fab fa-google-pay text-2xl"></i>
                Pay via Google Pay

            </button>

            <button
            onclick="triggerPayment('paytm')"
            class="btn-paytm w-full font-bold py-3.5 px-4 rounded-xl shadow flex items-center justify-center gap-3">

                <i class="fas fa-mobile-alt"></i>
                Pay via Paytm

            </button>

        </div>

    </div>

    <!-- UTR FORM -->

    <div id="utr-direct-section"
    class="mt-6 border-t pt-4 hidden-section">

        <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl mb-4">

            <p class="text-xs text-emerald-800 font-medium text-center">
                <i class="fas fa-reply mr-1"></i>

                Payment App Redirected Successfully.
                Enter Your 12 Digit UTR Number.
            </p>

        </div>

        <label class="text-gray-600 font-bold text-xs">
            12 Digit UTR Number
        </label>

        <input
        type="number"
        id="direct-utr"
        placeholder="Enter 12 Digit UTR"
        class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3.5 text-base mt-1 outline-none font-bold tracking-wider text-center">

        <button
        onclick="confirmDepositWithUtr()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow text-sm mt-3 uppercase tracking-wider">

            Verify & Update Wallet

        </button>

    </div>

</div>

<!-- HISTORY -->

<div class="history-card shadow-sm border border-gray-100">

    <h3 class="font-bold text-blue-900 text-sm mb-4">
        <i class="fas fa-history mr-2"></i>
        Recent Deposits
    </h3>

    <div id="history-list" class="space-y-3">

        <p class="text-center text-gray-400 text-xs py-4">
            No records found
        </p>

    </div>

</div>

<!-- HELP -->

<div class="px-4">

    <button
    onclick="openHelpModal()"
    class="w-full bg-gray-200 text-gray-700 hover:bg-gray-300 font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition-all">

        <i class="fas fa-question-circle mr-1"></i>

        Need Help / Submit Screenshot

    </button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    onValue,
    update,
    get,
    remove
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {

    apiKey: "AIzaSyC7apT-d-R9bpcb4LcpFk4P0cpw9sKxi-0",

    authDomain: "dbt-online-earning.firebaseapp.com",

    databaseURL: "https://dbt-online-earning-default-rtdb.firebaseio.com",

    projectId: "dbt-online-earning",

    storageBucket: "dbt-online-earning.firebasestorage.app",

    messagingSenderId: "319083357519",

    appId: "1:319083357519:web:62ccf6d8ce0dca3152513a"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

// RANDOM UPI IDS

const upiList = [

    "6353356656.wallet@phonepe",

    "8780091512@ptaxis",

    "tirathparmar7@okicici",


];

// QR SERIES

const qrSeries = {

    phonepe: [
        "ppqr1.png",
        "ppqr2.png",
        "ppqr3.png"
    ],

    gpay: [
        "gpqr1.png",
        "gpqr2.png",
        "gpqr3.png"
    ],

    paytm: [
        "pqr1.png",
        "pqr2.png",
        "pqr3.png"
    ]
};

let currentGlobalOrderId = "";

let systemSelectedRawAmount = 0;

let selectedQRName = "";

let selectedUPI = "";

window.validateAmount = function(){

    const amtInput =
    document.getElementById('final-amt').value;

    const appsSection =
    document.getElementById('apps-section');

    if(amtInput && parseFloat(amtInput) >= 100){

        appsSection.style.display = "block";

    }else{

        appsSection.style.display = "none";
    }
};

window.selectAmt = function(val,el){

    systemSelectedRawAmount = val;

    document.getElementById('final-amt').value = val;

    document.querySelectorAll('.amt-circle')
    .forEach(c => c.classList.remove('active'));

    el.querySelector('.amt-circle')
    .classList.add('active');

    validateAmount();
};

// PAYMENT FUNCTION

window.triggerPayment = async function(appType){

    const userPhone =
    localStorage.getItem('userPhone')
    || "9999999999";

    const userName =
    localStorage.getItem('userName')
    || "Unknown User";

    // RANDOM UPI

    selectedUPI =
    upiList[Math.floor(Math.random()*upiList.length)];

    // RANDOM QR

    const qrArray = qrSeries[appType];

    selectedQRName =
    qrArray[Math.floor(Math.random()*qrArray.length)];

    let finalPayableAmount =
    systemSelectedRawAmount;

    // RANDOM DECIMAL

    if(systemSelectedRawAmount >= 200){

        let randomDeduction = (
            Math.random() * (2.50 - 0.50) + 0.50
        ).toFixed(2);

        finalPayableAmount = (
            systemSelectedRawAmount - randomDeduction
        ).toFixed(2);
    }

    currentGlobalOrderId =
    "TXN" +
    Math.floor(10000000 + Math.random()*90000000);

    // SAVE TO FIREBASE

    await set(
        ref(db,'deposits/'+currentGlobalOrderId),
        {

            userName:userName,

            phone:userPhone,

            amount:systemSelectedRawAmount,

            payableAmount:finalPayableAmount,

            orderId:currentGlobalOrderId,

            usedUpi:selectedUPI,

            qrUsed:selectedQRName,

            paymentApp:appType,

            utr:"",

            status:"Pending",

            date:new Date().toLocaleString(),

            timestamp:Date.now()
        }
    );

    // AUTO DELETE PENDING AFTER 24 HOURS

    setTimeout(async()=>{

        const snap = await get(
            ref(db,'deposits/'+currentGlobalOrderId)
        );

        if(snap.exists()){

            const data = snap.val();

            if(data.status === "Pending"){

                await remove(
                    ref(db,'deposits/'+currentGlobalOrderId)
                );
            }
        }

    },86400000);

    // UPI INTENT

    let intentUrl =
    `upi://pay?pa=${selectedUPI}&pn=RelianceHub&am=${finalPayableAmount}&cu=INR`;

    if(appType === 'phonepe'){

        intentUrl +=
        `&package=com.phonepe.app`;
    }

    if(appType === 'gpay'){

        intentUrl +=
        `&package=com.google.android.apps.nbu.paisa.user`;
    }

    if(appType === 'paytm'){

        intentUrl +=
        `&package=net.one97.paytm`;
    }

    // REDIRECT

    window.location.href = intentUrl;

    // SHOW UTR AFTER 7 SEC

    setTimeout(()=>{

        document.getElementById(
            'utr-direct-section'
        ).style.display = "block";

        document.getElementById(
            'apps-section'
        ).style.display = "none";

    },7000);
};

// CONFIRM UTR

window.confirmDepositWithUtr = async function(){

    const utrVal =
    document.getElementById('direct-utr')
    .value.trim();

    if(utrVal.length !== 12 || isNaN(utrVal)){

        return Swal.fire(
            'Invalid UTR',
            'Enter exact 12 digit UTR',
            'warning'
        );
    }

    Swal.fire({

        title:'Processing...',

        allowOutsideClick:false,

        didOpen:()=>Swal.showLoading()

    });

    await update(
        ref(db,'deposits/'+currentGlobalOrderId),
        {

            utr:utrVal,

            status:"Success"
        }
    );

    Swal.fire(
        'Deposit Success!',
        `₹${systemSelectedRawAmount} Added Successfully`,
        'success'
    );

    document.getElementById(
        'utr-direct-section'
    ).style.display = "none";

    document.getElementById(
        'direct-utr'
    ).value = "";
};

// HELP MODAL

window.openHelpModal = function(){

    Swal.fire({

        title:'Deposit Help',

        html:`

        <div class="text-left space-y-3 p-1">

            <label class="text-xs font-bold text-gray-600 block">
                12 Digit UTR
            </label>

            <input
            type="number"
            placeholder="Enter UTR"
            class="w-full border p-2.5 rounded-lg text-sm mb-3">

            <label class="text-xs font-bold text-gray-600 block">
                Upload Screenshot
            </label>

            <input
            type="file"
            accept="image/*"
            class="w-full text-xs border p-2 rounded-lg">

        </div>
        `,

        showCancelButton:true,

        confirmButtonText:'Submit',

        confirmButtonColor:'#2563eb'
    });
};

// HISTORY

function loadHistory(){

    const userPhone =
    localStorage.getItem('userPhone')
    || "9999999999";

    onValue(ref(db,'deposits'),(snapshot)=>{

        const data = snapshot.val();

        const list =
        document.getElementById('history-list');

        if(!data) return;

        let historyHTML = '';

        Object.keys(data)
        .reverse()
        .forEach(key=>{

            const item = data[key];

            if(item.phone === userPhone){

                let sColor =
                "bg-yellow-100 text-yellow-600";

                if(item.status === "Success"){

                    sColor =
                    "bg-green-100 text-green-600";
                }

                if(item.status === "Failed"){

                    sColor =
                    "bg-red-100 text-red-600";
                }

                historyHTML += `

                <div class="flex justify-between items-center border-b pb-2">

                    <div>

                        <p class="font-bold text-sm text-gray-700">
                            ₹${item.amount}
                        </p>

                        <p class="text-[9px] text-gray-400">
                            ${item.date || ''}
                        </p>

                        <p class="text-[9px] text-gray-400">
                            UTR:
                            ${item.utr || 'N/A'}
                        </p>

                    </div>

                    <span class="text-[10px] font-bold ${sColor} px-2.5 py-1 rounded-full">

                        ${item.status}

                    </span>

                </div>
                `;
            }
        });

        if(historyHTML !== ''){

            list.innerHTML = historyHTML;
        }
    });
}

window.addEventListener(
    'DOMContentLoaded',
    loadHistory
);

</script>

</body>
</html>
