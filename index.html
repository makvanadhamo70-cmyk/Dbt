<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Investment Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        // Session Check
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = "dashboard.html";
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        body {
            background: url('loginbg.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            margin: 0; padding: 15px;
        }

        .glass-container {
            background: #ffffff; border-radius: 30px; width: 100%; max-width: 450px;
            overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            animation: zoomIn 0.6s ease-out; position: relative;
        }

        /* BALANCE BADGE - TOP RIGHT */
        .balance-badge {
            position: absolute; top: 15px; right: 15px;
            background: rgba(255, 255, 255, 0.95); padding: 5px 12px;
            border-radius: 20px; font-weight: 800; font-size: 13px;
            color: #1e40af; border: 1.5px solid #e2e8f0;
            z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none; align-items: center; gap: 5px;
        }

        /* LANGUAGE BTN - TOP LEFT */
        #translate-btn { 
            position: absolute; top: 15px; left: 15px; 
            font-size: 11px; cursor: pointer; background: white; 
            padding: 5px 12px; border-radius: 20px; z-index: 50; 
            font-weight: bold; border: 1px solid #ddd; 
        }

        .header-banner {
            background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRRVPxc5Mm3haZOQwmUgW2B1UUBbpDsd1kyWA&s') no-repeat center;
            background-size: cover; padding: 45px 20px; text-align: center;
        }

        .logo-box img { width: 130px; margin: 0 auto; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3)); }
        .welcome-text { color: white; font-size: 1.1rem; font-weight: 800; text-transform: uppercase; margin-top: 15px; text-shadow: 2px 2px 8px rgba(0,0,0,0.7); }
        .form-content { padding: 30px 25px; }
        .input-group { position: relative; margin-bottom: 18px; }
        .input-group i:first-child { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #6b7280; font-size: 1.1rem; }
        .form-input { width: 100%; background: #f8fafc; border-radius: 50px; padding: 14px 20px 14px 50px; border: 1.5px solid #e2e8f0; outline: none; transition: 0.3s; }
        .form-input:focus { border-color: #3b82f6; background: #fff; }
        .tab-btn { font-weight: 800; cursor: pointer; color: #94a3b8; transition: 0.3s; }
        .active-tab { color: #1e40af; border-bottom: 3px solid #1e40af; }
        .action-btn { width: 100%; font-weight: 800; padding: 16px; border-radius: 50px; margin-top: 5px; transition: 0.4s; text-transform: uppercase; }
        
        /* EYE ICON POSITIONING */
        .toggle-password { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #6b7280; font-size: 1.1rem; transition: 0.2s; }
        .toggle-password:hover { color: #3b82f6; }
    </style>
</head>
<body>

<div class="glass-container">
    <div class="balance-badge" id="bal-container">
        <i class="fas fa-wallet text-blue-600"></i>
        <span>₹<span id="real-time-bal">0.00</span></span>
    </div>

    <div id="translate-btn" onclick="toggleLanguage()"><i class="fas fa-language text-blue-600"></i> EN/HI</div>
    
    <div class="header-banner">
        <div class="logo-box"><img src="logo.png" alt="Logo"></div>
        <p id="welcome-txt" class="welcome-text">Welcome To Official Investment Hub</p>
    </div>

    <div class="form-content">
        <div class="flex justify-around mb-8">
            <span id="signup-tab" class="tab-btn active-tab text-md" onclick="switchTab('signup')">SIGN UP</span>
            <span id="signin-tab" class="tab-btn text-md" onclick="switchTab('signin')">SIGN IN</span>
        </div>

        <div id="signup-form">
            <div class="input-group"><i>+91</i><input type="number" id="phone" placeholder="Phone Number" class="form-input" style="padding-left: 60px;"></div>
            <div class="input-group"><i class="fas fa-user"></i><input type="text" id="nickname" placeholder="Nickname (Min 5 letters)" class="form-input"></div>
            <!-- SIGN UP PASSWORD WITH EYE -->
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="pass" placeholder="Password (Min 6 chars)" class="form-input" style="padding-right: 50px;">
                <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('pass', this)"></i>
            </div>
            <div class="input-group"><i class="fas fa-ticket-alt"></i><input type="text" id="invite" placeholder="Invitation Code" class="form-input"></div>
            <div class="input-group relative">
                <i class="fas fa-shield-alt"></i>
                <input type="text" id="otp-input" placeholder="Verification Code" class="form-input">
                <span class="absolute right-6 top-1/2 -translate-y-1/2 text-blue-600 font-bold cursor-pointer text-sm" onclick="sendOTP()" id="send-btn">SEND</span>
            </div>
            <button id="signup-btn" onclick="handleAuth('signup')" class="action-btn bg-blue-700 text-white">Sign Up Now</button>
        </div>

        <div id="signin-form" class="hidden">
            <div class="input-group"><i>+91</i><input type="number" id="login-phone" placeholder="Phone Number" class="form-input" style="padding-left: 60px;"></div>
            <!-- SIGN IN PASSWORD WITH EYE -->
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="login-pass" placeholder="Password" class="form-input" style="padding-right: 50px;">
                <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('login-pass', this)"></i>
            </div>
            <p id="forgot-btn" class="text-right text-red-500 text-xs font-bold mb-4 cursor-pointer" onclick="window.location.href='https://t.me/Dbt1Support'">Forgot Password?</p>
            <button id="signin-btn" onclick="handleAuth('signin')" class="action-btn bg-blue-900 text-white">Sign In Now</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, child, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC7apT-d-R9bpcb4LcpFk4P0cpw9sKxi-0",
        authDomain: "dbt-online-earning.firebaseapp.com",
        databaseURL: "https://dbt-online-earning-default-rtdb.firebaseio.com",
        projectId: "dbt-online-earning",
        storageBucket: "dbt-online-earning.firebasestorage.app",
        messagingSenderId: "319083357519",
        appId: "1:319083357519:web:62ccf6d8ce0dca3152513a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let generatedOTP = null;
    let currentLang = 'EN';

    // PASSWORD VISIBILITY TOGGLE FUNCTION
    window.togglePasswordVisibility = function(inputId, iconElement) {
        const passwordInput = document.getElementById(inputId);
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            iconElement.classList.remove("fa-eye");
            iconElement.classList.add("fa-eye-slash");
        } else {
            passwordInput.type = "password";
            iconElement.classList.remove("fa-eye-slash");
            iconElement.classList.add("fa-eye");
        }
    };

    // REAL-TIME BALANCE TRACKER
    const savedPhone = localStorage.getItem('userPhone');
    if (savedPhone) {
        document.getElementById('bal-container').style.display = 'flex';
        onValue(ref(db, 'users/' + savedPhone + '/balance'), (snap) => {
            document.getElementById('real-time-bal').innerText = (snap.val() || 0).toFixed(2);
        });
    }

    window.showMsg = (icon, text) => {
        Swal.fire({ icon: icon, title: text, position: 'center', showConfirmButton: true, confirmButtonColor: '#1e40af', timer: 3000 });
    };

    window.switchTab = (tab) => {
        document.getElementById('signup-form').classList.toggle('hidden', tab !== 'signup');
        document.getElementById('signin-form').classList.toggle('hidden', tab !== 'signin');
        document.getElementById('signup-tab').classList.toggle('active-tab', tab === 'signup');
        document.getElementById('signin-tab').classList.toggle('active-tab', tab === 'signin');
    };

    window.sendOTP = function() {
        const phone = document.getElementById('phone').value;
        if(phone.length < 10) return showMsg('error', 'Enter valid number!');
        generatedOTP = Math.floor(100000 + Math.random() * 900000);
        showMsg('success', 'Your Code: ' + generatedOTP);
    };

    window.toggleLanguage = function() {
        const welcomeTxt = document.getElementById('welcome-txt');
        const signupTab = document.getElementById('signup-tab');
        const signinTab = document.getElementById('signin-tab');
        const signupBtn = document.getElementById('signup-btn');
        const signinBtn = document.getElementById('signin-btn');
        const forgotBtn = document.getElementById('forgot-btn');

        if(currentLang === 'EN') {
            welcomeTxt.innerText = "ऑफिशियल इन्वेस्टमेंट हब में आपका स्वागत है";
            signupTab.innerText = "साइन अप";
            signinTab.innerText = "साइन इन";
            signupBtn.innerText = "अभी रजिस्टर करें";
            signinBtn.innerText = "लॉगिन करें";
            forgotBtn.innerText = "पासवर्ड भूल गए?";
            currentLang = 'HI';
        } else {
            welcomeTxt.innerText = "Welcome To Official Investment Hub";
            signupTab.innerText = "SIGN UP";
            signinTab.innerText = "SIGN IN";
            signupBtn.innerText = "Sign Up Now";
            signinBtn.innerText = "Sign In Now";
            forgotBtn.innerText = "Forgot Password?";
            currentLang = 'EN';
        }
    };

    window.handleAuth = async (type) => {
        if(type === 'signup') {
            const phone = document.getElementById('phone').value;
            const nick = document.getElementById('nickname').value;
            const pswd = document.getElementById('pass').value;
            const otp = document.getElementById('otp-input').value;
            if(!phone || !nick || !pswd) return showMsg('warning', 'Fill all fields!');
            if(otp != generatedOTP) return showMsg('error', 'Wrong OTP!');
            
            set(ref(db, 'users/' + phone), { phone, nickname: nick, password: pswd, balance: 0 }).then(() => { 
                showMsg('success', 'Registered Successfully!'); 
                switchTab('signin'); 
            });
        } else {
            const lPhone = document.getElementById('login-phone').value;
            const lPass = document.getElementById('login-pass').value;
            if(!lPhone || !lPass) return showMsg('warning', 'Enter details!');
            
            get(child(ref(db), `users/${lPhone}`)).then((snap) => {
                if (snap.exists() && snap.val().password === lPass) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userPhone', lPhone);
                    localStorage.setItem('userName', snap.val().nickname);
                    showMsg('success', 'Welcome ' + snap.val().nickname);
                    setTimeout(() => window.location.href = "dashboard.html", 1500);
                } else { 
                    showMsg('error', 'Invalid Phone or Password!'); 
                }
            });
        }
    };
</script>
</body>
</html>
